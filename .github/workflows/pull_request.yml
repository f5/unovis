name: Lint & Build

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
    - uses: pnpm/action-setup@v4
    - run: pnpm install --frozen-lockfile
    - run: pnpm run build && pnpm run build:dev
    # Fail when a typical chart's gzip size grows; see packages/ts/size-check.ts
    - run: pnpm run size:ts

  mcp:
    name: SSR + MCP (types, lint, tests)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.23.0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    # Text measurement uses Inter, which the server downloads once on first
    # render. Caching it keeps the suite off the network and makes text metrics
    # (and therefore the SVG snapshots) reproducible across runs.
    - name: Cache Inter fonts
      uses: actions/cache@v4
      with:
        path: ~/.cache/unovis-ssr
        key: unovis-ssr-fonts-${{ hashFiles('packages/ssr/src/env/fonts.ts') }}
        restore-keys: |
          unovis-ssr-fonts-
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    # Build order matters: @unovis/ts → @unovis/ssr → @unovis/mcp
    - name: Build @unovis/ts, @unovis/ssr and @unovis/mcp
      run: pnpm run build:mcp
    - name: Type-check
      run: cd packages/ssr && pnpm exec tsc --noEmit && cd ../mcp && pnpm exec tsc --noEmit
    - name: Lint
      run: pnpm exec eslint --quiet packages/ssr/src packages/ssr/test packages/mcp/src packages/mcp/test packages/mcp/scripts --ext .ts
    # The website pages under docs/mcp are generated from packages/mcp/docs, so
    # editing the docs without re-running the sync would ship a stale website
    - name: Check website docs are in sync
      run: |
        cd packages/website && pnpm run sync:mcp-docs
        git diff --exit-code -- docs/mcp static/schema \
          || (echo "::error::packages/website/docs/mcp is stale — run 'pnpm --filter @unovis/website sync:mcp-docs' and commit the result" && exit 1)
    # Covers the env shims, every recipe (SVG snapshots), post-processing, the
    # MCP surface over a real client, the browser widget bundle, and
    # type-checking of generated code
    - name: Test
      run: cd packages/ssr && pnpm test && cd ../.. && pnpm run test:mcp
    # jsdom performs no layout, paint or real event dispatch — a broken
    # crosshair once passed every jsdom test. Chromium renders every family
    # and drives hover/click/theme with real input; screenshots land in the
    # sample-gallery artifact.
    - name: Install Playwright Chromium
      run: cd packages/mcp && pnpm exec playwright install --with-deps chromium
    - name: Browser smoke lane
      run: cd packages/mcp && pnpm run test:browser
    # A chart nobody can look at is a chart nobody can trust: render every
    # fixture in both themes so failures surface as artifacts, not just logs
    - name: Render sample gallery
      run: cd packages/mcp && pnpm run samples
    - name: Upload sample gallery
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chart-samples
        path: packages/mcp/samples/out
        retention-days: 7
  # Screenshots every dev example (packages/dev, capture mode) from the pull request's build
  # and from its merge base, and reports the examples whose pixels changed. No baselines are
  # stored: both sides are captured on the same runner in the same job. Advisory — a change
  # is a prompt to open the `visual-comparison` artifact, not a failed check.
  visual:
    name: Visual comparison (dev examples vs merge base)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # The checkout is the PR merged into its base, so the merge base is the base branch tip:
    # the comparison shows what merging the PR changes
    - name: Find the merge base
      id: base
      run: echo "sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.base.outputs.sha }}
        path: base
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    # The dev app bundles the core and the React wrapper from source; only the Leaflet
    # worker chunk comes from the core's dist
    - name: Build the pull request
      run: pnpm run build:ts && pnpm run build:dev
    # The base build only changes when the base branch moves, so it is cached by commit
    - name: Restore the base build
      id: base-build
      uses: actions/cache@v4
      with:
        path: base/packages/dev/dist
        key: dev-dist-${{ steps.base.outputs.sha }}
    - name: Build the base
      if: steps.base-build.outputs.cache-hit != 'true'
      working-directory: base
      run: pnpm install --frozen-lockfile && pnpm run build:ts && pnpm run build:dev
    - name: Install Playwright Chromium
      run: pnpm --dir packages/dev exec playwright install --with-deps chromium
    # Both captures use the PR's scripts and the PR's `serve`; only the served dist differs
    - name: Capture the base
      run: pnpm --dir packages/dev visual:capture --serve "$PWD/base/packages/dev/dist" --out "$PWD/visual-captures/base"
    - name: Capture the pull request
      run: pnpm --dir packages/dev visual:capture --serve "$PWD/packages/dev/dist" --out "$PWD/visual-captures/head"
    - name: Compare
      continue-on-error: true
      run: |
        set -o pipefail
        pnpm --dir packages/dev visual:compare --before "$PWD/visual-captures/base" --after "$PWD/visual-captures/head" --out "$PWD/visual-captures/report" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-comparison
        path: visual-captures/report
        retention-days: 14
    - name: Upload the pull request captures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-captures
        path: visual-captures/head
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
    - uses: pnpm/action-setup@v4
    - run: pnpm install --frozen-lockfile
    - run: pnpm run test:ts
    - run: pnpm run build:ts && pnpm run build:svelte && pnpm --dir packages/svelte test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
    - uses: pnpm/action-setup@v4
    - run: pnpm install --frozen-lockfile
    - run: pnpm run build:ts && pnpm run build:svelte
    # Enforce the commit-message convention on the PR's commits.
    - name: Validate commit messages
      run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
    # Lint only the files this PR changes, so the existing repo-wide lint debt
    # doesn't block PRs while still gating newly touched code.
    - name: Lint changed files
      shell: bash
      run: |
        base="${{ github.event.pull_request.base.sha }}"
        head="${{ github.event.pull_request.head.sha }}"
        files=$(git diff --name-only --diff-filter=ACMR "$base...$head" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.svelte')
        if [ -z "$files" ]; then
          echo "No lintable files changed — skipping."
          exit 0
        fi
        echo "Linting changed files:"
        echo "$files"
        pnpm exec eslint --ignore-path .gitignore $files
