name: Lint & Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Lint & commit validation (PRs only) ────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: pnpm/action-setup@v4
      with:
        version: 10.23.0
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    # Enforce the commit-message convention on the PR's commits.
    - name: Validate commit messages
      run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
    # Lint only the files this PR changes, so the existing repo-wide lint debt
    # doesn't block PRs while still gating newly touched code.
    - name: Lint changed files
      shell: bash
      run: |
        base="${{ github.event.pull_request.base.sha }}"
        head="${{ github.event.pull_request.head.sha }}"
        files=$(git diff --name-only --diff-filter=ACMR "$base...$head" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.svelte')
        if [ -z "$files" ]; then
          echo "No lintable files changed — skipping."
          exit 0
        fi
        echo "Linting changed files:"
        echo "$files"
        pnpm exec eslint --ignore-path .gitignore $files

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.23.0
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    - name: Run commands report
      run: node scripts/commands-report.js
    # By default this job runs headless and will NOT generate an HTML report.
    # Use the separate `generate-report` workflow job (manual) to create/upload it.
  generate-report:
    name: 'Generate Commands HTML Report (manual)'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.23.0
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    - name: Run commands report (generate HTML)
      env:
        GENERATE_REPORT: '1'
      run: node scripts/commands-report.js
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: commands-report
        path: unovis-commands-report-*.html
