name: Lint & Build

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
    - uses: pnpm/action-setup@v4
    - run: pnpm install --frozen-lockfile
    - run: pnpm run build && pnpm run build:dev

  mcp:
    name: SSR + MCP (types, lint, tests)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.23.0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    # Text measurement uses Inter, which the server downloads once on first
    # render. Caching it keeps the suite off the network and makes text metrics
    # (and therefore the SVG snapshots) reproducible across runs.
    - name: Cache Inter fonts
      uses: actions/cache@v4
      with:
        path: ~/.cache/unovis-ssr
        key: unovis-ssr-fonts-${{ hashFiles('packages/ssr/src/env/fonts.ts') }}
        restore-keys: |
          unovis-ssr-fonts-
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    # Build order matters: @unovis/ts → @unovis/ssr → @unovis/mcp
    - name: Build @unovis/ts, @unovis/ssr and @unovis/mcp
      run: pnpm run build:mcp
    - name: Type-check
      run: cd packages/ssr && pnpm exec tsc --noEmit && cd ../mcp && pnpm exec tsc --noEmit
    - name: Lint
      run: pnpm exec eslint --quiet packages/ssr/src packages/ssr/test packages/mcp/src packages/mcp/test packages/mcp/scripts --ext .ts
    # The website pages under docs/mcp are generated from packages/mcp/docs, so
    # editing the docs without re-running the sync would ship a stale website
    - name: Check website docs are in sync
      run: |
        cd packages/website && pnpm run sync:mcp-docs
        git diff --exit-code -- docs/mcp \
          || (echo "::error::packages/website/docs/mcp is stale — run 'pnpm --filter @unovis/website sync:mcp-docs' and commit the result" && exit 1)
    # Covers the env shims, every recipe (SVG snapshots), post-processing, the
    # MCP surface over a real client, the browser widget bundle, and
    # type-checking of generated code
    - name: Test
      run: cd packages/ssr && pnpm test && cd ../.. && pnpm run test:mcp
    # A chart nobody can look at is a chart nobody can trust: render every
    # fixture in both themes so failures surface as artifacts, not just logs
    - name: Render sample gallery
      run: cd packages/mcp && pnpm run samples
    - name: Upload sample gallery
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chart-samples
        path: packages/mcp/samples/out
        retention-days: 7
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
    - uses: pnpm/action-setup@v4
    - run: pnpm install --frozen-lockfile
    - run: pnpm run test:ts

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
    - uses: pnpm/action-setup@v4
    - run: pnpm install --frozen-lockfile
    # Enforce the commit-message convention on the PR's commits.
    - name: Validate commit messages
      run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
    # Lint only the files this PR changes, so the existing repo-wide lint debt
    # doesn't block PRs while still gating newly touched code.
    - name: Lint changed files
      shell: bash
      run: |
        base="${{ github.event.pull_request.base.sha }}"
        head="${{ github.event.pull_request.head.sha }}"
        files=$(git diff --name-only --diff-filter=ACMR "$base...$head" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.svelte')
        if [ -z "$files" ]; then
          echo "No lintable files changed — skipping."
          exit 0
        fi
        echo "Linting changed files:"
        echo "$files"
        pnpm exec eslint --ignore-path .gitignore $files
