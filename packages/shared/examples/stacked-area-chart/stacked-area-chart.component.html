<vis-bullet-legend [items]="legendItems"></vis-bullet-legend>
<vis-xy-container [data]="data" [height]="500" [svgDefs]="svgDefs">
  <vis-area [x]="x" [y]="y" [color]="color"></vis-area>
  <vis-axis type="x" label="Year" [numTicks]="10" [domainLine]="false" [gridLine]="false"></vis-axis>
  <vis-axis type="y" label="Revenue (USD, billions)" [numTicks]="10"></vis-axis>
  <vis-xy-labels
    [x]="x"
    [y]="labelY"
    [label]="labelText"
    [backgroundColor]="labelColor"
    [clusterLabel]="noLabel"
    clusterBackgroundColor="none"
   ></vis-xy-labels>
  <vis-crosshair [x]="x" [yStacked]="y" [template]="tooltipTemplate"></vis-crosshair>
  <vis-tooltip></vis-tooltip>
</vis-xy-container>
