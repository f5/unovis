<div class="gallery-example">
  <div class="gallery-controls">
    <label class="gallery-select">
      Origin airport
      <select [value]="state.hub" (change)="changeHub($event)">
        <option *ngFor="let option of c.hubOptions" [value]="option.value">{{ option.label }}</option>
      </select>
    </label>
  </div>
  <vis-bullet-legend [items]="[]"></vis-bullet-legend>
  <p class="gallery-summary" aria-live="polite">{{ view.summary }}</p>
  <div class="gallery-route-layout">
    <div class="gallery-panel">
      <p class="gallery-caption">Busiest destinations · passengers</p>
      <vis-xy-container [height]="470" [duration]="600" [yDirection]="'south'">
        <vis-stacked-bar
          [data]="view.data"
          [x]="c.rank"
          [y]="c.passengers"
          [orientation]="'horizontal'"
          [color]="'var(--vis-color0)'"
          [barPadding]="0.25"></vis-stacked-bar>
        <vis-axis [numTicks]="3" [type]="'x'" [tickFormat]="c.compact" [label]="'Passengers'"></vis-axis>
        <vis-axis [type]="'y'" [tickValues]="c.rankTicks" [tickFormat]="view.destinationLabel" [gridLine]="false"></vis-axis>
      </vis-xy-container>
    </div>
    <div class="gallery-panel">
      <p class="gallery-caption">Passengers from the selected hub</p>
      <vis-single-container [height]="470" [duration]="600">
        <vis-topojson-map
          [data]="view.mapData"
          [topojson]="c.usa"
          [mapFeatureName]="'states'"
          [projection]="view.projection"
          [disableZoom]="true"
          [pointId]="c.id"
          [pointBottomLabel]="c.pointLabel"
          [pointRadius]="c.radius"
          [pointColor]="'var(--vis-color0)'"
          [linkSource]="c.linkSource"
          [linkTarget]="c.linkTarget"
          [linkWidth]="c.linkWidth"
          [linkColor]="'var(--vis-color0)'"
          [sourceLatitude]="c.sourceLatitude"
          [sourceLongitude]="c.sourceLongitude"
          [targetLatitude]="c.targetLatitude"
          [targetLongitude]="c.targetLongitude"
          [flowParticleDensity]="view.density"
          [flowParticleColor]="'var(--vis-color1)'"
          [flowParticleRadius]="1.6"
          [enableFlowAnimation]="true"
          [latitude]="c.latitude"
          [longitude]="c.longitude"></vis-topojson-map>
        <vis-tooltip [className]="c.tooltipClassName" [container]="c.tooltipContainer" [triggers]="c.tooltipTriggers"></vis-tooltip>
      </vis-single-container>
    </div>
  </div>
</div>
