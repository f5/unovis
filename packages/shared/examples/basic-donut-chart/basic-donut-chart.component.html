
<div class="donut-chart">
  <h3>Most Common Password Categories</h3>
  <vis-bullet-legend [items]="legendItems"></vis-bullet-legend>
  <vis-single-container [height]="400">
    <vis-donut
      [value]="value"
      [icon]="icon"
      [data]="data"
      [showEmptySegments]="true"
      [padAngle]="0.01"
      [arcWidth]="100"
    />
  </vis-single-container>
</div>
